# apphosting.yaml

# Settings for Cloud Run
runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1


# Cabeceras de respuesta que afectan a la política de seguridad del navegador
headers:
  - headers:
      # Esto le dice al navegador que la ventana abierta por el pop-up de Google
      # es segura para comunicarse y cerrarse.
      'Cross-Origin-Opener-Policy': 'same-origin-allow-popups'
    path: '/**' # Aplica esta cabecera a todas las rutas

    
# Environment variables and secrets
env:
  # Referencia al secreto en Cloud Secret Manager
  # El nombre de la variable de entorno DEBE coincidir con el código
  - variable: FIREBASE_ADMIN_CREDENTIALS_PATH
    secret: firebase-admin-key
  
  # Incluye aquí tu otra variable:
  - variable: ALLOWED_ORIGIN
    value: https://proyectotombola--proyectotombola-51309.us-east4.hosted.app/ 

  - variable: GOOGLE_SHEET_CSV_URL
    value: https://docs.google.com/spreadsheets/d/e/2PACX-1vSi2qCJ3jkKp8yLIejPQmmzx3wwLNwvyRa-k2F4Pw40ksp7bTSJxPQdaKP5nYNbutulyIcBmPcPGG1q/pub?output=csv